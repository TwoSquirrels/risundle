[package]
name = "risundle"
version = "0.1.0"
edition = "2024"
authors = ["TwoSquirrels"]
description = "A C++ bundler with tree-shaking for competitive programming"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
