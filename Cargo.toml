[package]
name = "risundle"
version = "0.1.0"
edition = "2024"
authors = ["TwoSquirrels"]
description = "A C++ bundler with tree-shaking for competitive programming"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
serde_json = "1.0.150"
tree-sitter = "0.26.9"
tree-sitter-cpp = "0.23.4"
sha2 = "0.11.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile = "3.27.0"
