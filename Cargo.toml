[package]
name = "risundle"
version = "1.1.0"
edition = "2024"
authors = ["TwoSquirrels"]
description = "A C++ bundler with tree-shaking for competitive programming"
license = "MIT"
repository = "https://github.com/TwoSquirrels/risundle"
readme = "README.md"
keywords = ["competitive", "cpp", "bundler", "tree-shaking", "atcoder"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["tests/fixtures", "docs", "rust-toolchain.toml", "rustfmt.toml"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
serde_json = "1.0.150"
tree-sitter = "0.26.9"
tree-sitter-cpp = "0.23.4"
sha2 = "0.11.0"
logos = "0.16.1"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
mod_module_files = "warn"

[dev-dependencies]
tempfile = "3.27.0"
assert_cmd = "2.0"
predicates = "3.1"
