name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  # OS とコンパイラの各軸を最低 1 回ずつ踏むフルスイート (ユニット + tests/ の統合・E2E)。
  # Ubuntu + g++ の組は下の coverage ジョブが兼ねるためここには置かない。E2E のコンパイラは
  # RISUNDLE_TEST_COMPILER で切り替わり、<bits/stdc++.h> に依存するテストはそれを提供しない
  # コンパイラ (libc++ の Apple clang 等) で自己スキップする。Windows の clang++ は既定で MSVC の
  # 標準ライブラリと繋がる特殊構成のため対象外。
  test:
    name: test (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: clang++
          - os: macos-latest
            compiler: clang++
          - os: macos-26-intel
            compiler: clang++
          - os: windows-latest
            compiler: g++
    env:
      RISUNDLE_TEST_COMPILER: ${{ matrix.compiler }}
    steps:
      # Windows では std ダミーツリー生成 (数千個の小ファイル書き込み) が Defender の
      # リアルタイムスキャンに捕まり、テストが桁違いに遅くなる (#58)。使い捨てランナーなので、
      # ワークスペース・一時ディレクトリ・cargo キャッシュをスキャン対象から外す。
      # ランナーの TEMP は 8.3 短縮形 (RUNNER~1) で入っており実パスと照合されない恐れがあるため、
      # 同じ場所を指す長い表記 (LOCALAPPDATA\Temp) も並べて除外する。
      - name: Exclude build directories from Windows Defender
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath @(
            $env:GITHUB_WORKSPACE,
            $env:RUNNER_TEMP,
            $env:TEMP,
            (Join-Path $env:LOCALAPPDATA 'Temp'),
            (Join-Path $env:USERPROFILE '.cargo')
          )
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # ランナー標準のコンパイラに依存しているため、無ければここで分かりやすく落とす。
      - run: ${{ matrix.compiler }} --version
      - run: cargo test --locked --all-features

  # Linux のフルスイート (ユニット + tests/ の統合・E2E) を計測し、Pages へカバレッジを公開する。
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-llvm-cov

      - name: Collect coverage
        run: cargo llvm-cov --locked --all-features --no-report

      - name: Build report and badge
        run: |
          cargo llvm-cov report --html --output-dir target/llvm-cov
          pct=$(cargo llvm-cov report --json --summary-only \
            | jq '.data[0].totals.lines.percent')
          rounded=$(awk -v p="$pct" 'BEGIN { printf "%.1f", p }')
          color=$(awk -v p="$pct" 'BEGIN {
            if      (p >= 90) print "brightgreen"
            else if (p >= 75) print "green"
            else if (p >= 60) print "yellowgreen"
            else if (p >= 40) print "yellow"
            else if (p >= 20) print "orange"
            else              print "red"
          }')
          mkdir -p _site
          cp -r target/llvm-cov/html/. _site/
          jq -n --arg m "${rounded}%" --arg c "$color" \
            '{schemaVersion: 1, label: "coverage", message: $m, color: $c}' > _site/badge.json

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy-pages:
    name: deploy coverage to Pages
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  package:
    name: package (publish dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo publish --locked --dry-run

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-audit
      - run: cargo audit
